# Azure AD OAuth: long ?code=… on callback + NextAuth Set-Cookie headers exceed nginx defaults.
# Symptom: "upstream sent too big header" in /var/log/nginx/error.log → 502 on
# /api/auth/callback/azure-ad and next-auth "State cookie was missing".
large_client_header_buffers 8 32k;
proxy_buffer_size 128k;
proxy_buffers 8 128k;
proxy_busy_buffers_size 256k;
