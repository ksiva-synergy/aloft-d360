# Build/push ECR images; deploy web to Elastic Beanstalk on main.
#
# GitHub secrets:
#   AWS_ROLE_ARN — IAM role for OIDC (see trust policy below)
#
# GitHub variables (optional overrides):
#   EB_APPLICATION_NAME  default aloft-d360-web
#   EB_ENVIRONMENT_NAME  default Aloft-d360-web-env
#   ENABLE_EB_DEPLOY     set to "false" to skip EB deploy (default: deploy on main after ECR push)
#   DOCKER_PLATFORM_WEB  default linux/arm64 (t4g Beanstalk). Use linux/amd64 if EB is t3.
#   DOCKER_PLATFORM_HARVESTER  default linux/amd64 (x86 Fargate). Use linux/arm64 if ECS is Graviton.
#
# IAM role needs:
#   ECR push (harvester + web repos)
#   elasticbeanstalk:CreateApplicationVersion, UpdateEnvironment, Describe*
#   S3 on elasticbeanstalk-ap-south-1-ACCOUNT_ID — include s3:CreateBucket (EB checks bucket on update-environment)
#   See infra/aws/github-actions-deploy-permissions.policy.json
#
# OIDC trust — paste infra/aws/github-oidc-trust-policy.example.json on aloftGitHubActionsDeployRole (640012953890)

name: Build, push ECR, deploy Beanstalk

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      deploy_beanstalk:
        description: Deploy web to Elastic Beanstalk after ECR push
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_HARVESTER: aloft-context-harvester
  ECR_WEB: aloft-d360-web
  EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME || 'aloft-d360-web' }}
  EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME || 'Aloft-d360-web-env' }}

jobs:
  build-harvester:
    name: Harvester → ECR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.harvester
          push: true
          platforms: ${{ vars.DOCKER_PLATFORM_HARVESTER || 'linux/amd64' }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_HARVESTER }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_HARVESTER }}:${{ github.sha }}

  build-web:
    name: Web → ECR
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image URI
        id: meta
        run: echo "image_uri=${{ steps.ecr.outputs.registry }}/${{ env.ECR_WEB }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: ${{ vars.DOCKER_PLATFORM_WEB || 'linux/arm64' }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_WEB }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_WEB }}:${{ github.sha }}

  deploy-beanstalk:
    name: Elastic Beanstalk deploy
    needs: build-web
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build-web.result == 'success' &&
      vars.ENABLE_EB_DEPLOY != 'false' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_beanstalk)
      )
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Package Beanstalk source bundle
        id: bundle
        env:
          IMAGE_URI: ${{ needs.build-web.outputs.image_uri }}
        run: |
          set -euo pipefail
          VERSION_LABEL="gh-${{ github.run_number }}-${{ github.sha }}"
          VERSION_LABEL="${VERSION_LABEL:0:100}"
          STAGING="${RUNNER_TEMP}/eb-bundle"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -r infra/beanstalk/.platform "$STAGING/"
          cp -r infra/beanstalk/.ebextensions "$STAGING/"
          jq -n --arg img "$IMAGE_URI" \
            '{AWSEBDockerrunVersion:"1",Image:{Name:$img,Update:"true"},Ports:[{ContainerPort:"3000"}],Logging:"/var/log/aloft-web"}' \
            > "$STAGING/Dockerrun.aws.json"
          (cd "$STAGING" && zip -r "$RUNNER_TEMP/eb-bundle.zip" .)
          echo "version_label=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"
          echo "zip_path=${RUNNER_TEMP}/eb-bundle.zip" >> "$GITHUB_OUTPUT"

      - name: Upload bundle and deploy
        env:
          VERSION_LABEL: ${{ steps.bundle.outputs.version_label }}
          ZIP_PATH: ${{ steps.bundle.outputs.zip_path }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="elasticbeanstalk-${AWS_REGION}-${ACCOUNT_ID}"
          S3_KEY="${EB_APPLICATION_NAME}/${VERSION_LABEL}.zip"

          aws s3 cp "$ZIP_PATH" "s3://${BUCKET}/${S3_KEY}" --region "$AWS_REGION"

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle "S3Bucket=${BUCKET},S3Key=${S3_KEY}" \
            --region "$AWS_REGION"

          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT_NAME" \
            --version-label "$VERSION_LABEL" \
            --region "$AWS_REGION"

          echo "Deployed ${VERSION_LABEL} to ${EB_ENVIRONMENT_NAME} (image in Dockerrun.aws.json)"

  require-eb-deploy:
    name: Require Beanstalk deploy (main)
    needs: [build-web, deploy-beanstalk]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build-web.result == 'success'
    steps:
      - name: Fail workflow if Beanstalk deploy was skipped or failed
        run: |
          set -euo pipefail
          if [ "${{ vars.ENABLE_EB_DEPLOY }}" = "false" ]; then
            echo "ENABLE_EB_DEPLOY=false — Beanstalk deploy intentionally disabled."
            exit 0
          fi
          RESULT="${{ needs.deploy-beanstalk.result }}"
          if [ "$RESULT" != "success" ]; then
            echo "::error::Elastic Beanstalk deploy did not succeed (result=$RESULT). Fix deploy-beanstalk or set repo variable ENABLE_EB_DEPLOY=false only if EB should stay off."
            exit 1
          fi
          echo "Beanstalk deploy succeeded."
