# Manual OIDC troubleshooting — does not deploy anything.
# Actions → "Diagnose GitHub OIDC → AWS" → Run workflow (branch: main).
#
# Compare printed `sub` to IAM trust on the role in AWS_ROLE_ARN.
# If "with session tags" fails but "skip session tags" succeeds → add sts:TagSession to trust or keep role-skip-session-tagging in ecr-push.yml.

name: Diagnose GitHub OIDC → AWS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-claims:
    name: Print GitHub + OIDC claims
    runs-on: ubuntu-latest
    steps:
      - name: Workflow context
        run: |
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "event=${{ github.event_name }}"
          echo "run_id=${{ github.run_id }}"

      - name: Decode OIDC token (sub must match IAM trust)
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payloadB64 = token.split('.')[1];
            const json = JSON.parse(Buffer.from(payloadB64, 'base64url').toString('utf8'));
            core.summary.addHeading('OIDC claims (IAM trust must allow this sub)');
            core.summary.addCodeBlock(JSON.stringify(json, null, 2), 'json');
            await core.summary.write();
            console.log('sub (copy into IAM StringEquals/StringLike):', json.sub);
            console.log('aud:', json.aud);
            console.log('repository:', json.repository);
            console.log('ref:', json.ref);

  assume-skip-tags:
    name: Assume role (skip session tags)
    runs-on: ubuntu-latest
    needs: oidc-claims
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-skip-session-tagging: true

      - name: Verify caller
        run: aws sts get-caller-identity

  assume-with-tags:
    name: Assume role (with session tags)
    runs-on: ubuntu-latest
    needs: oidc-claims
    continue-on-error: true
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify caller
        if: success()
        run: aws sts get-caller-identity

      - name: Hint if this job failed
        if: failure()
        run: |
          echo "::warning::Assume WITH session tags failed. If assume-skip-tags succeeded, add sts:TagSession to the role trust policy or use role-skip-session-tagging in CI."
